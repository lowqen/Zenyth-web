# zenyth-desktop(Tauri 셸) 빌드 — 데스크톱 Z2.
#
# 개발 기기에는 Rust · MSVC 를 깔지 않고 이 잡이 Windows 러너에서 셸을 빌드한다(2026-11-08 사용자 결정).
# 산출물(셸 exe · NSIS 설치판 · Cargo.lock)은 아티팩트로 내려받아 실제 창에서 확인한다.
# 웹 번들 · 엔진 조립은 deploy.yml 과 같은 단계를 그대로 쓴다 — 셸은 dist/ 를 실을 뿐이다.
name: desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/src-tauri/**"
      - "src/app/desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # deploy.yml 과 같은 엔진 릴리스(src/engine/engine-manifest.json 의 tag).
  ENGINE_TAG: engine-3c94c2a9-a6

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - shell: bash
        run: pnpm build

      - name: 엔진 조립
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/engine
          node tools/ci/release-download.mjs "$ENGINE_TAG" dist/engine 'rapfi-*.js' 'rapfi-*.wasm' 'rapfi.data' 'engine-manifest.json' \
            || { echo "::error::엔진 릴리스 $ENGINE_TAG 를 받지 못했습니다."; exit 1; }
          echo '{ "type": "commonjs" }' > dist/engine/package.json
          pnpm exec tsx scripts/verify-engine.ts

      # 소스맵은 셸 exe 에 싣지 않는다(배포와 같다 — 원본 TS 가 드러나지 않게, 크기도 준다).
      - name: 소스맵 빼기
        shell: bash
        run: find dist -name '*.map' -delete

      # 러너에 rustup 이 깔려 있다 — 바깥 액션 없이 안정판만 맞춘다.
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: desktop-cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.toml', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-cargo-${{ runner.os }}-

      # NSIS 도구(nsis · nsis_tauri_utils.dll)는 tauri 가 GitHub 릴리스에서 받는다 — 그 내려받기가 504 로
      # 연달아 떨어진 적이 있어(Z4) 받아 둔 것을 캐시하고, 번들 단계만 몇 번 다시 해 본다(컴파일은 증분이다).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/tauri
          key: desktop-tauri-tools-${{ runner.os }}-v1

      - name: 셸 빌드 (exe + NSIS)
        shell: bash
        working-directory: desktop
        run: |
          for i in 1 2 3 4; do
            pnpm exec tauri build --ci && exit 0
            echo "::warning::셸 빌드 실패($i/4) — 30초 뒤 다시"
            sleep 30
          done
          exit 1

      - name: 크기
        shell: bash
        run: |
          ls -la desktop/src-tauri/target/release/zenyth-desktop.exe desktop/src-tauri/target/release/bundle/nsis/
          {
            echo "### zenyth-desktop"
            echo '```'
            ls -la desktop/src-tauri/target/release/zenyth-desktop.exe desktop/src-tauri/target/release/bundle/nsis/*.exe
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zenyth-desktop-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/zenyth-desktop.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14
