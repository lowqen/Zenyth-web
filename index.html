<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zenyth Web — 오목·렌주 분석반</title>
    <meta name="description" content="Rapfi 엔진을 브라우저에서 돌리는 오목·렌주 분석반." />
    <meta name="color-scheme" content="light dark" />
    <!-- Z8: 앱과 같은 «일식» 아이콘(scripts/gen-icons.ts). 상단 색은 페이지 면(Mist 99 / 10). -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#FCFCFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1B1E" media="(prefers-color-scheme: dark)" />
    <!-- 페인트 전에 테마 확정(FOUC 방지). CSP 가 인라인 스크립트를 막아 public/ 의 파일로 둔다. -->
    <script src="%BASE_URL%theme-init.js"></script>
  </head>
  <body>
    <!-- 데스크톱 Z6: 셸 창이 번들보다 먼저 보일 때의 골격 타이틀바(끌기만 된다 — 셸이 심은 drag-region 처리). React 의 첫
         커밋이 #root 를 비우며 진짜 TitleBar 로 바뀐다. 웹에서는 숨는다(base.css .bootbar). -->
    <div id="root">
      <header class="titlebar bootbar" data-tauri-drag-region>
        <span class="titlebar__app" data-tauri-drag-region>Zenyth</span>
      </header>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
