# zenyth-desktop — Zenyth Web 을 감싸는 Tauri 2 셸.
# 설계 · 결정 기록: gomoku-dev test-yixin/docs/개발_핸드북.md §14 (데스크톱 계획 Z0~Z7 을 병합한 절).
# 웹 빌드(`pnpm build` → dist/)를 그대로 싣고, 기본 엔진은 셸 옆 engine/ 에 동봉한 네이티브 Rapfi 다(WASM 은 폴백).
# 버전은 tauri.conf.json 과 같아야 한다(scripts/tauri-config.test.ts) — 릴리스 태그 desktop-v<버전>.
[package]
name = "zenyth-desktop"
version = "1.0.0"
description = "Zenyth — 오목·렌주 분석반 (데스크톱)"
license = "GPL-3.0-or-later"
edition = "2021"
# CpuIsa::detect 의 avx512* · avxvnni 감지가 1.89 에서 안정화됐다.
rust-version = "1.89"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
# generate_context! 가 tauri.conf.json 의 plugins 칸(업데이터)을 serde_json::Value 로 펼친다.
serde_json = "1"

[profile.release]
# 셸은 작게(계획 §6 «배포 크기»). 무거운 일은 웹뷰 · 엔진이 한다.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
